<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate Checker — your real minimum hourly rate</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0e14;--c:#131a26;--b:#232c3f;--t:#e6ebf4;--m:#8b96ab;--a:#22d3a5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:"Segoe UI",system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;margin:0 auto}
h1{font-size:26px;margin-bottom:4px}.hint{color:var(--m);font-size:14px;margin-bottom:22px}
label{display:block;font-size:13px;color:var(--m);margin-bottom:14px}
input{width:100%;margin-top:6px;padding:11px;background:#1a2130;border:1px solid var(--b);border-radius:10px;color:var(--t);font-size:16px}
input:focus{outline:none;border-color:var(--a)}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--a);color:#06281f;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.res{margin-top:20px;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:20px;display:none}
.big{font-size:38px;font-weight:700;color:var(--a)}
.row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--b)}
.row:last-child{border:0}.row span:first-child{color:var(--m)}
</style></head><body><main>
<h1>Rate Checker</h1>
<p class="hint">The hourly rate you must charge to hit your income — after the costs nobody counts.</p>
<form id="f" autocomplete="off">
<label>Target yearly income ($)<input type="number" id="inc" value="80000" min="1"></label>
<label>Yearly business expenses ($)<input type="number" id="exp" value="6000" min="0"></label>
<label>Tax & fees (%)<input type="number" id="tax" value="30" min="0" max="90"></label>
<label>BILLABLE hours per week <span style="color:var(--a)">(not worked hours!)</span><input type="number" id="hrs" value="25" min="1" max="80"></label>
<label>Weeks off per year (vacation, sick, dead months)<input type="number" id="off" value="6" min="0" max="52"></label>
<button type="submit">Check my rate</button>
</form>
<div class="res" id="res"></div>
<script>
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
var inc=+document.getElementById('inc').value||0,exp=+document.getElementById('exp').value||0,
tax=+document.getElementById('tax').value||0,hrs=+document.getElementById('hrs').value||1,off=+document.getElementById('off').value||0;
var weeks=Math.max(1,52-off),gross=inc+exp,taxAmt=gross*(tax/100),need=gross+0,
billable=weeks*hrs,rate=(gross/(1-tax/100))/billable,
market=rate*1.3;
document.getElementById('res').style.display='block';
document.getElementById('res').innerHTML=
'<div class="big">$'+rate.toFixed(0)+'/hr minimum</div>'+
'<div class="row"><span>Gross revenue needed</span><span>$'+Math.round(gross).toLocaleString()+'</span></div>'+
'<div class="row"><span>Tax set-aside</span><span>$'+Math.round(gross*tax/100).toLocaleString()+'</span></div>'+
'<div class="row"><span>Billable hours/year ('+hrs+'h × '+weeks+'w)</span><span>'+billable.toLocaleString()+'</span></div>'+
'<div class="row"><span>Sane market rate (+30%)</span><span>$'+market.toFixed(0)+'/hr</span></div>';});
</script></main></body></html>
